# Every push to main is tested, built and published to Cloudflare Pages.
# Pull requests stop after the build: nothing they contain reaches the site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mytno --branch=main

      # Bing, Yandex and Seznam are told the moment a page changes; Google reads the sitemap.
      - name: Ping IndexNow
        if: github.ref == 'refs/heads/main'
        run: npm run indexnow
        continue-on-error: true
