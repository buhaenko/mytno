# Production-ish stack: MongoDB + the Tarifo API + the built site behind nginx.
# Local development does not need this — `npm run dev` starts an embedded MongoDB.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: tarifo
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 8787
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["8787:8787"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8787}
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  mongo-data:
