  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="What it costs to clear customs and register a car: duty, excise, VAT and registration taxes at official rates. VIN lookup, full model catalogue, 43 countries of purchase and 28 destinations." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#F4F4F6" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="mytno.app — Car import tax calculator by VIN" />
    <meta property="og:description" content="Duty, excise, VAT and registration taxes at official rates. VIN lookup and a full model catalogue." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://mytno.app/og/en.png" />
    <meta property="og:site_name" content="mytno.app" />
    <meta name="application-name" content="mytno.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />

    <meta name="apple-mobile-web-app-title" content="mytno" />
    <!--seo-->
    <script>document.documentElement.className = 'js'</script>
    <style>
      /* The prerendered text is for crawlers without JavaScript. A browser gets the app
         instead — and, until it arrives, a turning ring rather than a flash of the other
         layout. Inline, because it has to work before any stylesheet has loaded. */
      .js #app.pending > * { display: none; }
      .js #app.pending { min-height: 58vh; display: grid; place-items: center; }
      .js #app.pending::after {
        content: ''; width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid #E3E3E7; border-top-color: #E2662A;
        animation: mytno-turn .8s linear infinite;
      }
      .js #app.ready { animation: mytno-in .28s cubic-bezier(.2, .8, .2, 1); }
      @keyframes mytno-turn { to { transform: rotate(1turn); } }
      @keyframes mytno-in { from { opacity: 0; transform: translateY(4px); } }
      @media (prefers-reduced-motion: reduce) {
        .js #app.pending::after { animation: none; }
        .js #app.ready { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="pending"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
