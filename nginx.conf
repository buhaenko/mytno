server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed assets never change; the entry documents must revalidate.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /catalog/ { expires 7d; add_header Cache-Control "public"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # /uk/, /es/ … are prerendered folders; a share code like /uk/ab3k falls back to that language's page.
  location / { try_files $uri $uri/ $uri/index.html /index.html; }
}
